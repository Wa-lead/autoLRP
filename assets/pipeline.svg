<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #4a4a4a; stroke-width: 1.5; rx: 8; }
      .code { fill: #f3f4f6; stroke: #4a4a4a; stroke-width: 1.5; rx: 8; }
      .title { font-size: 15px; font-weight: 600; fill: #1f1f1f; }
      .sub { font-size: 12px; fill: #4a4a4a; }
      .mono { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 13px; fill: #1f1f1f; }
      .lane { font-size: 12px; fill: #8a8a8a; letter-spacing: 1px; }
      .line { stroke: #4a4a4a; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .side { stroke: #9a9a9a; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- lane labels -->
  <text x="20" y="42" class="lane">FORWARD</text>
  <text x="20" y="322" class="lane">BACKWARD, ONE .lrp() CALL</text>

  <!-- forward row -->
  <rect x="20" y="58" width="180" height="70" class="code"/>
  <text x="34" y="85" class="mono">x = autoLRP.tensor(img)</text>
  <text x="34" y="106" class="sub">wrap the input</text>

  <rect x="240" y="58" width="180" height="70" class="code"/>
  <text x="254" y="85" class="mono">out = model(x)</text>
  <text x="254" y="106" class="sub">the model, unchanged</text>

  <rect x="460" y="58" width="240" height="70" class="box"/>
  <text x="474" y="85" class="title">intercept</text>
  <text x="474" y="106" class="sub">a few ops save what the rules need</text>

  <rect x="740" y="58" width="200" height="70" class="box"/>
  <text x="754" y="85" class="title">autograd graph</text>
  <text x="754" y="106" class="sub">one node per operation</text>

  <path d="M 200 93 L 238 93" class="line"/>
  <path d="M 420 93 L 458 93" class="line"/>
  <path d="M 700 93 L 738 93" class="line"/>

  <!-- backward row -->
  <rect x="20" y="228" width="150" height="70" class="box"/>
  <text x="34" y="255" class="title">walk</text>
  <text x="34" y="276" class="sub">node name to installer</text>

  <rect x="210" y="228" width="150" height="70" class="box"/>
  <text x="224" y="255" class="title">analyze</text>
  <text x="224" y="276" class="sub">facts on nodes</text>

  <rect x="400" y="228" width="150" height="70" class="box"/>
  <text x="414" y="255" class="title">resolve</text>
  <text x="414" y="276" class="sub">fact, else name</text>

  <rect x="590" y="228" width="150" height="70" class="box"/>
  <text x="604" y="255" class="title">backward</text>
  <text x="604" y="276" class="sub">hooks turn grads into R</text>

  <rect x="780" y="228" width="160" height="70" class="code"/>
  <text x="794" y="255" class="mono">x.relevance</text>
  <text x="794" y="276" class="sub">what reached the input</text>

  <path d="M 170 263 L 208 263" class="line"/>
  <path d="M 360 263 L 398 263" class="line"/>
  <path d="M 550 263 L 588 263" class="line"/>
  <path d="M 740 263 L 778 263" class="line"/>

  <!-- graph feeds the walk -->
  <path d="M 840 128 L 840 170 L 95 170 L 95 226" class="line"/>

  <!-- side inputs -->
  <text x="212" y="196" class="sub">analyzers</text>
  <path d="M 262 200 L 262 226" class="side"/>
  <text x="402" y="196" class="sub">LRPConfig</text>
  <path d="M 452 200 L 452 226" class="side"/>
</svg>
