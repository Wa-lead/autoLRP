# Place at the repository root (rootdir), beside the autoLRP package and
# the tests/ directory.
[pytest]
testpaths = tests
markers =
    slow: full-model conservation matrix (30 models); include with -m '' or -m slow
# The suite is 2-3 s total; slow tests are NOT deselected by default.
# Deselect with -m 'not slow' if that ever changes.
